# 抓取本地跑的 uvicorn（app/main.py 暴露 /metrics，Prometheus 文本格式）
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: slot-booking
    metrics_path: /metrics
    static_configs:
      # 宿主机 8001 端口。应用是本地 `uv run uvicorn app.main:app --port 8001` 起的，
      # 不放进 compose 是为了保持开发时 --reload 的手感。
      - targets: ["host.docker.internal:8001"]
        labels:
          instance: local
